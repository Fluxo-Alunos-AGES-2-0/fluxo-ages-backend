# Conex�o JDBC - O formato � ${VARIAVEL:VALOR_PADRAO}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fluxo_db}
spring.datasource.username=${DB_USER_LOCAL}
spring.datasource.password=${DB_PASS_LOCAL}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8081

spring.config.import=optional:file:.env[.properties]

# Flyway já cuida da criação e população do banco
# (Removemos defer-datasource-initialization e sql.init.mode)

# Swagger / OpenAPI - Força a ordem alfabética das tags
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Configurações do Mailtrap
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.upload.dir=uploads

# Tamanho máximo para upload de arquivos
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB


