# Conex�o JDBC - O formato � ${VARIAVEL:VALOR_PADRAO}
# O perfil padrao eh o 'dev'. Quando rodar na AWS, substitua por SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8081

spring.config.import=optional:file:.env[.properties]

# Swagger / OpenAPI - Força a ordem alfabética das tags
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Configurações de e-mail via SMTP
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.from=${APP_EMAIL_FROM:}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-2}
app.storage.s3.key-prefix=${APP_STORAGE_S3_KEY_PREFIX:}
app.storage.s3.presigned-url-duration-minutes=${APP_STORAGE_S3_PRESIGNED_URL_DURATION_MINUTES:60}
app.storage.s3.access-key=${APP_STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${APP_STORAGE_S3_SECRET_KEY:}

# Tamanho máximo para upload de arquivos
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Força o Flyway a procurar nesta pasta específica
spring.flyway.locations=classpath:db/migration

# O SEGREDO: Força o app a dar um ERRO CLARO se a pasta estiver com o nome errado
spring.flyway.fail-on-missing-locations=true

# Cria a tabela de histórico se ela não existir
spring.flyway.baseline-on-migrate=true
