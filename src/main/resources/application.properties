# Conex�o JDBC - O formato � ${VARIAVEL:VALOR_PADRAO}
# O perfil padrao eh o 'dev'. Quando rodar na AWS, substitua por SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8081

spring.config.import=optional:file:.env[.properties]

# Swagger / OpenAPI - Força a ordem alfabética das tags
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Configurações do Mailtrap
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.upload.dir=uploads

# Tamanho máximo para upload de arquivos
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
