# JWT
jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=3600

# Banco em memória H2 (substitui o PostgreSQL nos testes)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Desativa o Flyway nos testes (o H2 cria as tabelas pelo Hibernate)
spring.flyway.enabled=false

# Mail desativa envio real nos testes
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# AWS S3 valores fictícios para não falhar na inicialização
aws.region=us-east-1
aws.accessKeyId=test
aws.secretAccessKey=test

# A chave do bucket:
app.storage.s3.bucket=test-bucket

# Desativa o data.sql nos testes (ON CONFLICT é sintaxe PostgreSQL, não roda no H2)
spring.sql.init.mode=never